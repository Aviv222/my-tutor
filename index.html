<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoStep - 60 שלבים!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .duo-green { background-color: #58cc02; }
        .duo-blue { background-color: #1cb0f6; }
        .duo-red { background-color: #ff4b4b; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-right" dir="rtl">

    <header class="p-4 flex flex-col gap-2 items-center bg-white sticky top-0 z-10 w-full max-w-2xl mx-auto mt-4 shadow-sm rounded-b-2xl">
        <div class="flex justify-between w-full items-center">
            <button onclick="resetProgress()" class="text-[10px] text-gray-400 hover:text-red-500 font-bold transition-colors">🗑️ איפוס הכל</button>
            <span id="levelIndicator" class="text-sm font-bold text-gray-500 font-mono">טוען...</span>
            <span id="xpCount" class="text-sm font-bold text-orange-400 font-mono text-left">0 XP ⚡</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-4">
            <div id="progressBar" class="duo-green h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center p-6 max-w-2xl mx-auto w-full fade-in" id="mainContainer">
        <h2 id="questionText" class="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-8 leading-relaxed"></h2>
        <div id="interactiveArea" class="w-full max-w-md"></div>
    </main>

    <footer id="feedbackFooter" class="fixed bottom-0 left-0 w-full p-6 duo-green text-white hidden transform transition-transform translate-y-full z-20 transition-all duration-300">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex flex-col gap-1">
                <h3 id="feedbackTitle" class="font-bold text-2xl">מצוין! 🎉</h3>
                <p id="tutorMessage" class="text-sm md:text-base opacity-90"></p>
            </div>
            <button id="continueBtn" onclick="advanceOrRetry()" class="bg-white font-bold px-8 py-3 rounded-xl shadow-[0_4px_0_rgba(0,0,0,0.2)] active:translate-y-1 active:shadow-none text-lg">
                המשך
            </button>
        </div>
    </footer>

    <script>
        let currentStep = parseInt(localStorage.getItem('lingo_v6_step')) || 0;
        let xp = parseInt(localStorage.getItem('lingo_v6_xp')) || 0;
        let isCurrentCorrect = false;

        const lessons = [
            // --- יחידה 1: חיות ---
            { type: 'choice', quest: 'איך אומרים "כלב"?', target: 'perro', options: [{ id:'pajaro', icon:'🐦', label:'Pájaro' }, { id:'perro', icon:'🐶', label:'Perro' }, { id:'gato', icon:'🐱', label:'Gato' }], tutor: 'Perro (כלב).' },
            { type: 'choice', quest: 'איך אומרים "חתול"?', target: 'gato', options: [{ id:'vaca', icon:'🐄', label:'Vaca' }, { id:'gato', icon:'🐱', label:'Gato' }, { id:'caballo', icon:'🐴', label:'Caballo' }], tutor: 'Gato (חתול).' },
            { type: 'choice', quest: 'איך אומרים "ציפור"?', target: 'pajaro', options: [{ id:'pajaro', icon:'🐦', label:'Pájaro' }, { id:'perro', icon:'🐶', label:'Perro' }, { id:'vaca', icon:'🐄', label:'Vaca' }], tutor: 'Pájaro (ציפור).' },
            { type: 'choice', quest: 'איך אומרים "סוס"?', target: 'caballo', options: [{ id:'caballo', icon:'🐴', label:'Caballo' }, { id:'gato', icon:'🐱', label:'Gato' }, { id:'pajaro', icon:'🐦', label:'Pájaro' }], tutor: 'Caballo (סוס).' },
            { type: 'choice', quest: 'איך אומרים "פרה"?', target: 'vaca', options: [{ id:'perro', icon:'🐶', label:'Perro' }, { id:'vaca', icon:'🐄', label:'Vaca' }, { id:'caballo', icon:'🐴', label:'Caballo' }], tutor: 'Vaca (פרה).' },
            { type: 'text', quest: '📝 מבחן כתיבה: "כלב"', target: 'perro', tutor: 'Perro 🐶' },
            { type: 'text', quest: '📝 מבחן כתיבה: "חתול"', target: 'gato', tutor: 'Gato 🐱' },
            { type: 'text', quest: '📝 מבחן כתיבה: "ציפור"', target: 'pajaro', tutor: 'Pájaro 🐦' },
            { type: 'text', quest: '📝 מבחן כתיבה: "סוס"', target: 'caballo', tutor: 'Caballo 🐴' },
            { type: 'text', quest: '📝 מבחן כתיבה: "פרה"', target: 'vaca', tutor: 'Vaca 🐄' },

            // --- יחידה 2: אוכל ---
            { type: 'choice', quest: 'איך אומרים "מים"?', target: 'agua', options: [{ id:'leche', icon:'🥛', label:'Leche' }, { id:'agua', icon:'💧', label:'Agua' }, { id:'cafe', icon:'☕', label:'Café' }], tutor: 'Agua (מים).' },
            { type: 'choice', quest: 'איך אומרים "לחם"?', target: 'pan', options: [{ id:'pan', icon:'🍞', label:'Pan' }, { id:'queso', icon:'🧀', label:'Queso' }, { id:'carne', icon:'🥩', label:'Carne' }], tutor: 'Pan (לחם).' },
            { type: 'choice', quest: 'איך אומרים "תפוח"?', target: 'manzana', options: [{ id:'banana', icon:'🍌', label:'Banana' }, { id:'manzana', icon:'🍎', label:'Manzana' }, { id:'uva', icon:'🍇', label:'Uva' }], tutor: 'Manzana (תפוח).' },
            { type: 'choice', quest: 'איך אומרים "חלב"?', target: 'leche', options: [{ id:'agua', icon:'💧', label:'Agua' }, { id:'leche', icon:'🥛', label:'Leche' }, { id:'cafe', icon:'☕', label:'Café' }], tutor: 'Leche (חלב).' },
            { type: 'choice', quest: 'איך אומרים "קפה"?', target: 'cafe', options: [{ id:'cafe', icon:'☕', label:'Café' }, { id:'pan', icon:'🍞', label:'Pan' }, { id:'agua', icon:'💧', label:'Agua' }], tutor: 'Café (קפה).' },
            { type: 'text', quest: '📝 מבחן כתיבה: "מים"', target: 'agua', tutor: 'Agua 💧' },
            { type: 'text', quest: '📝 מבחן כתיבה: "לחם"', target: 'pan', tutor: 'Pan 🍞' },
            { type: 'text', quest: '📝 מבחן כתיבה: "תפוח"', target: 'manzana', tutor: 'Manzana 🍎' },
            { type: 'text', quest: '📝 מבחן כתיבה: "חלב"', target: 'leche', tutor: 'Leche 🥛' },
            { type: 'text', quest: '📝 מבחן כתיבה: "קפה"', target: 'cafe', tutor: 'Café ☕' },

            // --- יחידה 3: צבעים ---
            { type: 'choice', quest: 'איך אומרים "אדום"?', target: 'rojo', options: [{ id:'rojo', icon:'🔴', label:'Rojo' }, { id:'azul', icon:'🔵', label:'Azul' }, { id:'verde', icon:'🟢', label:'Verde' }], tutor: 'Rojo.' },
            { type: 'choice', quest: 'איך אומרים "כחול"?', target: 'azul', options: [{ id:'verde', icon:'🟢', label:'Verde' }, { id:'azul', icon:'🔵', label:'Azul' }, { id:'amarillo', icon:'🟡', label:'Amarillo' }], tutor: 'Azul.' },
            { type: 'choice', quest: 'איך אומרים "ירוק"?', target: 'verde', options: [{ id:'blanco', icon:'⚪', label:'Blanco' }, { id:'rojo', icon:'🔴', label:'Rojo' }, { id:'verde', icon:'🟢', label:'Verde' }], tutor: 'Verde.' },
            { type: 'choice', quest: 'איך אומרים "צהוב"?', target: 'amarillo', options: [{ id:'amarillo', icon:'🟡', label:'Amarillo' }, { id:'negro', icon:'⚫', label:'Negro' }, { id:'azul', icon:'🔵', label:'Azul' }], tutor: 'Amarillo.' },
            { type: 'choice', quest: 'איך אומרים "שחור"?', target: 'negro', options: [{ id:'blanco', icon:'⚪', label:'Blanco' }, { id:'negro', icon:'⚫', label:'Negro' }, { id:'rojo', icon:'🔴', label:'Rojo' }], tutor: 'Negro.' },
            { type: 'text', quest: '📝 מבחן כתיבה: "אדום"', target: 'rojo', tutor: 'Rojo 🔴' },
            { type: 'text', quest: '📝 מבחן כתיבה: "כחול"', target: 'azul', tutor: 'Azul 🔵' },
            { type: 'text', quest: '📝 מבחן כתיבה: "ירוק"', target: 'verde', tutor: 'Verde 🟢' },
            { type: 'text', quest: '📝 מבחן כתיבה: "צהוב"', target: 'amarillo', tutor: 'Amarillo 🟡' },
            { type: 'text', quest: '📝 מבחן כתיבה: "שחור"', target: 'negro', tutor: 'Negro ⚫' },

            // --- יחידה 4: מספרים ---
            { type: 'choice', quest: 'איך אומרים 1?', target: 'uno', options: [{ id:'dos', icon:'2️⃣', label:'Dos' }, { id:'uno', icon:'1️⃣', label:'Uno' }, { id:'tres', icon:'3️⃣', label:'Tres' }], tutor: 'Uno.' },
            { type: 'choice', quest: 'איך אומרים 2?', target: 'dos', options: [{ id:'tres', icon:'3️⃣', label:'Tres' }, { id:'uno', icon:'1️⃣', label:'Uno' }, { id:'dos', icon:'2️⃣', label:'Dos' }], tutor: 'Dos.' },
            { type: 'choice', quest: 'איך אומרים 3?', target: 'tres', options: [{ id:'tres', icon:'3️⃣', label:'Tres' }, { id:'cuatro', icon:'4️⃣', label:'Cuatro' }, { id:'cinco', icon:'5️⃣', label:'Cinco' }], tutor: 'Tres.' },
            { type: 'choice', quest: 'איך אומרים 4?', target: 'cuatro', options: [{ id:'dos', icon:'2️⃣', label:'Dos' }, { id:'cinco', icon:'5️⃣', label:'Cinco' }, { id:'cuatro', icon:'4️⃣', label:'Cuatro' }], tutor: 'Cuatro.' },
            { type: 'choice', quest: 'איך אומרים 5?', target: 'cinco', options: [{ id:'cinco', icon:'5️⃣', label:'Cinco' }, { id:'uno', icon:'1️⃣', label:'Uno' }, { id:'tres', icon:'3️⃣', label:'Tres' }], tutor: 'Cinco.' },
            { type: 'text', quest: '📝 מבחן כתיבה: "אחד"', target: 'uno', tutor: 'Uno 1️⃣' },
            { type: 'text', quest: '📝 מבחן כתיבה: "שתיים"', target: 'dos', tutor: 'Dos 2️⃣' },
            { type: 'text', quest: '📝 מבחן כתיבה: "שלוש"', target: 'tres', tutor: 'Tres 3️⃣' },
            { type: 'text', quest: '📝 מבחן כתיבה: "ארבע"', target: 'cuatro', tutor: 'Cuatro 4️⃣' },
            { type: 'text', quest: '📝 מבחן כתיבה: "חמש"', target: 'cinco', tutor: 'Cinco 5️⃣' },

            // --- יחידה 5: אנשים ומשפחה ---
            { type: 'choice', quest: 'איך אומרים "ילד"?', target: 'nino', options: [{ id:'nino', icon:'👦', label:'Niño' }, { id:'nina', icon:'👧', label:'Niña' }, { id:'mujer', icon:'👩', label:'Mujer' }], tutor: 'Niño.' },
            { type: 'choice', quest: 'איך אומרים "ילדה"?', target: 'nina', options: [{ id:'hombre', icon:'👨', label:'Hombre' }, { id:'nina', icon:'👧', label:'Niña' }, { id:'nino', icon:'👦', label:'Niño' }], tutor: 'Niña.' },
            { type: 'choice', quest: 'איך אומרים "אישה"?', target: 'mujer', options: [{ id:'mujer', icon:'👩', label:'Mujer' }, { id:'hombre', icon:'👨', label:'Hombre' }, { id:'nino', icon:'👦', label:'Niño' }], tutor: 'Mujer.' },
            { type: 'choice', quest: 'איך אומרים "גבר"?', target: 'hombre', options: [{ id:'nina', icon:'👧', label:'Niña' }, { id:'mujer', icon:'👩', label:'Mujer' }, { id:'hombre', icon:'👨', label:'Hombre' }], tutor: 'Hombre.' },
            { type: 'choice', quest: 'איך אומרים "תינוק"?', target: 'bebe', options: [{ id:'bebe', icon:'👶', label:'Bebé' }, { id:'nino', icon:'👦', label:'Niño' }, { id:'hombre', icon:'👨', label:'Hombre' }], tutor: 'Bebé.' },
            { type: 'text', quest: '📝 מבחן כתיבה: "ילד"', target: 'nino', tutor: 'Niño 👦' },
            { type: 'text', quest: '📝 מבחן כתיבה: "ילדה"', target: 'nina', tutor: 'Niña 👧' },
            { type: 'text', quest: '📝 מבחן כתיבה: "אישה"', target: 'mujer', tutor: 'Mujer 👩' },
            { type: 'text', quest: '📝 מבחן כתיבה: "גבר"', target: 'hombre', tutor: 'Hombre 👨' },
            { type: 'text', quest: '📝 מבחן כתיבה: "תינוק"', target: 'bebe', tutor: 'Bebé 👶' },

            // --- יחידה 6: מקומות וטיולים ---
            { type: 'choice', quest: 'איך אומרים "שירותים"?', target: 'bano', options: [{ id:'hotel', icon:'🏨', label:'Hotel' }, { id:'bano', icon:'🚽', label:'Baño' }, { id:'casa', icon:'🏠', label:'Casa' }], tutor: 'Baño.' },
            { type: 'choice', quest: 'איך אומרים "מלון"?', target: 'hotel', options: [{ id:'escuela', icon:'🏫', label:'Escuela' }, { id:'hotel', icon:'🏨', label:'Hotel' }, { id:'restaurante', icon:'🍽️', label:'Restaurante' }], tutor: 'Hotel.' },
            { type: 'choice', quest: 'איך אומרים "בית"?', target: 'casa', options: [{ id:'casa', icon:'🏠', label:'Casa' }, { id:'bano', icon:'🚽', label:'Baño' }, { id:'coche', icon:'🚗', label:'Coche' }], tutor: 'Casa.' },
            { type: 'choice', quest: 'איך אומרים "בית ספר"?', target: 'escuela', options: [{ id:'hotel', icon:'🏨', label:'Hotel' }, { id:'escuela', icon:'🏫', label:'Escuela' }, { id:'casa', icon:'🏠', label:'Casa' }], tutor: 'Escuela.' },
            { type: 'choice', quest: 'איך אומרים "מכונית"?', target: 'coche', options: [{ id:'coche', icon:'🚗', label:'Coche' }, { id:'casa', icon:'🏠', label:'Casa' }, { id:'hotel', icon:'🏨', label:'Hotel' }], tutor: 'Coche.' },
            { type: 'text', quest: '📝 מבחן כתיבה: "שירותים"', target: 'bano', tutor: 'Baño 🚽' },
            { type: 'text', quest: '📝 מבחן כתיבה: "מלון"', target: 'hotel', tutor: 'Hotel 🏨' },
            { type: 'text', quest: '📝 מבחן כתיבה: "בית"', target: 'casa', tutor: 'Casa 🏠' },
            { type: 'text', quest: '📝 מבחן כתיבה: "בית ספר"', target: 'escuela', tutor: 'Escuela 🏫' },
            { type: 'text', quest: '📝 מבחן כתיבה: "מכונית"', target: 'coche', tutor: 'Coche 🚗' }
        ];

        function saveData() {
            localStorage.setItem('lingo_v6_step', currentStep);
            localStorage.setItem('lingo_v6_xp', xp);
        }

        function resetProgress() {
            if(confirm("בטוחה שאת רוצה למחוק 60 שלבים ולהתחיל מהתחלה?")) {
                localStorage.removeItem('lingo_v6_step');
                localStorage.removeItem('lingo_v6_xp');
                location.reload();
            }
        }

        function renderLesson() {
            document.getElementById('feedbackFooter').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('feedbackFooter').classList.add('hidden'), 300);
            
            const container = document.getElementById('mainContainer');
            container.classList.remove('fade-in');
            void container.offsetWidth; 
            container.classList.add('fade-in');

            if (currentStep >= lessons.length) {
                document.getElementById('questionText').innerText = "וואו! סיימת 60 שלבים! הקורס הושלם! 🏆🥇";
                document.getElementById('interactiveArea').innerHTML = `<button onclick="resetProgress()" class="w-full duo-blue text-white font-bold py-4 rounded-xl shadow-[0_4px_0_#1899d6] text-xl">התחילי קורס חדש</button>`;
                return;
            }

            const lesson = lessons[currentStep];
            
            if(lesson.quest.includes("מבחן כתיבה")) {
                document.getElementById('questionText').innerHTML = `<span class="text-purple-600">${lesson.quest}</span>`;
            } else {
                document.getElementById('questionText').innerText = lesson.quest;
            }

            const area = document.getElementById('interactiveArea');
            
            if (lesson.type === 'text') {
                area.innerHTML = `
                    <div class="flex flex-col gap-4">
                        <input type="text" id="userInput" placeholder="הקלידי בספרדית..." onkeydown="if(event.key==='Enter')checkAnswer()" 
                            class="w-full p-4 text-xl border-2 border-gray-300 rounded-xl focus:border-[#1cb0f6] focus:bg-blue-50 outline-none text-center font-bold" dir="ltr" autocomplete="off">
                        <button onclick="checkAnswer()" class="w-full duo-blue text-white font-bold px-8 py-4 rounded-xl shadow-[0_4px_0_#1899d6] active:translate-y-1 active:shadow-none text-xl">
                            בדיקה
                        </button>
                    </div>`;
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            } 
            else if (lesson.type === 'choice') {
                area.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    ${lesson.options.map(opt => `
                        <button onclick="checkChoiceAnswer('${opt.id}')" 
                            class="flex flex-col items-center justify-center p-6 border-2 border-gray-200 rounded-2xl hover:bg-blue-50 hover:border-[#1cb0f6] active:bg-blue-100 shadow-sm transition-all group">
                            <span class="text-6xl mb-4 group-hover:scale-110 transition-transform">${opt.icon}</span>
                            <span class="font-bold text-gray-700 text-xl">${opt.label}</span>
                        </button>
                    `).join('')}
                </div>`;
            }
            updateUI();
        }

        function checkAnswer() {
            const input = document.getElementById('userInput');
            const answer = input.value.toLowerCase().replace(/[¿?¡!.,]/g, '').trim();
            const target = lessons[currentStep].target.toLowerCase();
            if (!answer) return;
            showFeedback(answer === target, target);
        }

        function checkChoiceAnswer(id) {
            const target = lessons[currentStep].target;
            showFeedback(id === target, target);
        }

        function showFeedback(isCorrect, targetWord) {
            isCurrentCorrect = isCorrect;
            const footer = document.getElementById('feedbackFooter');
            const title = document.getElementById('feedbackTitle');
            const msg = document.getElementById('tutorMessage');
            const btn = document.getElementById('continueBtn');
            
            footer.classList.remove('hidden');
            setTimeout(() => footer.classList.remove('translate-y-full'), 10);
            
            if (isCorrect) {
                footer.className = "fixed bottom-0 left-0 w-full p-6 text-white z-20 transition-all duration-300 duo-green";
                btn.style.color = '#58cc02';
                btn.innerText = "המשך";
                title.innerText = "מצוין! 🎉";
                msg.innerText = lessons[currentStep].tutor;
                xp += 20;
                document.getElementById('xpCount').innerText = xp + " XP ⚡";
            } else {
                footer.className = "fixed bottom-0 left-0 w-full p-6 text-white z-20 transition-all duration-300 duo-red";
                btn.style.color = '#ff4b4b';
                btn.innerText = "הבנתי, אנסה שוב";
                title.innerText = "לא בדיוק... 😕";
                msg.innerText = "התשובה הנכונה היא: " + targetWord;
            }
        }

        function advanceOrRetry() {
            if (isCurrentCorrect) {
                currentStep++;
                saveData();
                renderLesson();
            } else {
                document.getElementById('feedbackFooter').classList.add('translate-y-full');
                setTimeout(() => document.getElementById('feedbackFooter').classList.add('hidden'), 300);
                
                const input = document.getElementById('userInput');
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }

        function updateUI() {
            document.getElementById('xpCount').innerText = xp + " XP ⚡";
            const displayLvl = currentStep < lessons.length ? currentStep + 1 : lessons.length;
            document.getElementById('levelIndicator').innerText = displayLvl + "/" + lessons.length;
            document.getElementById('progressBar').style.width = (currentStep / lessons.length) * 100 + "%";
        }

        window.onload = renderLesson;
    </script>
</body>
</html>
