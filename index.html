<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoStep - למידה בשלבים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .duo-green { background-color: #58cc02; }
        .duo-blue { background-color: #1cb0f6; }
        /* אנימציות מעבר חלקות בין השלבים */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white h-screen flex flex-col font-sans text-right" dir="rtl">

    <header class="p-4 flex flex-col gap-2 items-center bg-white sticky top-0 z-10 w-full max-w-2xl mx-auto mt-4">
        <div class="flex justify-between w-full items-center">
            <button onclick="resetProgress()" class="text-[10px] text-gray-400 hover:text-red-500 font-bold transition-colors">🗑️ איפוס הכל</button>
            <span id="levelIndicator" class="text-sm font-bold text-gray-400">שלב 1/3</span>
            <span id="xpCount" class="text-sm font-bold text-orange-400">0 XP ⚡</span>
        </div>
        
        <div class="w-full bg-gray-200 rounded-full h-4">
            <div id="progressBar" class="duo-green h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center p-6 max-w-2xl mx-auto w-full fade-in" id="mainContainer">
        
        <h2 id="questionText" class="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-8">
            טוען משימה...
        </h2>

        <div id="interactiveArea" class="w-full max-w-md">
            </div>

    </main>

    <footer id="feedbackFooter" class="fixed bottom-0 left-0 w-full p-6 duo-green text-white hidden transform transition-transform translate-y-full">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex flex-col gap-1">
                <h3 class="font-bold text-2xl">מצוין!</h3>
                <p id="tutorMessage" class="text-sm md:text-base opacity-90">הסבר המורה יופיע כאן</p>
            </div>
            <button onclick="advanceLesson()" class="bg-white text-[#58cc02] font-bold px-8 py-3 rounded-xl shadow-[0_4px_0_rgba(0,0,0,0.2)] active:translate-y-1 active:shadow-none text-lg">
                המשך
            </button>
        </div>
    </footer>

    <script>
        // --- זיכרון (localStorage) ---
        let currentStep = parseInt(localStorage.getItem('lingoStep_step_clean')) || 0;
        let xp = parseInt(localStorage.getItem('lingoStep_xp_clean')) || 0;

        // --- המשימות ---
        const lessons = [
            { 
                type: 'text', 
                quest: 'איך אומרים "שלום" בספרדית?', 
                target: 'hola', 
                tutor: '¡Hola! (אוֹלָה) - ה-H שותקת בספרדית.' 
            },
            { 
                type: 'choice', 
                quest: 'איך אומרים "כלב"?', 
                target: 'perro', 
                options: [
                    { id: 'gato', icon: '🐱', label: 'Gato' }, 
                    { id: 'perro', icon: '🐶', label: 'Perro' }, 
                    { id: 'pajaro', icon: '🐦', label: 'Pájaro' }
                ], 
                tutor: 'El perro (הכלב). גלגלי את ה-R!' 
            },
            { 
                type: 'choice', 
                quest: 'איך אומרים "חתול"?', 
                target: 'gato', 
                options: [
                    { id: 'gato', icon: '🐱', label: 'Gato' }, 
                    { id: 'pez', icon: '🐟', label: 'Pez' }, 
                    { id: 'vaca', icon: '🐄', label: 'Vaca' }
                ], 
                tutor: 'El gato (החתול). פשוט וקל.' 
            }
        ];

        // --- פונקציות שמירה ---
        function saveData() {
            localStorage.setItem('lingoStep_step_clean', currentStep);
            localStorage.setItem('lingoStep_xp_clean', xp);
        }

        function resetProgress() {
            if(confirm("בטוחה שאת רוצה למחוק הכל ולהתחיל מהתחלה?")) {
                localStorage.removeItem('lingoStep_step_clean');
                localStorage.removeItem('lingoStep_xp_clean');
                location.reload();
            }
        }

        // --- טעינת המסך ---
        function renderLesson() {
            // הסתרת בר הפידבק הירוק מתחתית המסך אם הוא פתוח
            document.getElementById('feedbackFooter').classList.add('hidden', 'translate-y-full');
            
            // אפקט אנימציה של כניסה
            const container = document.getElementById('mainContainer');
            container.classList.remove('fade-in');
            void container.offsetWidth; // טריק לאיפוס האנימציה
            container.classList.add('fade-in');

            // בדיקה אם סיימנו הכל
            if (currentStep >= lessons.length) {
                document.getElementById('questionText').innerText = "כל הכבוד! סיימת את כל השלבים! 🎉";
                document.getElementById('interactiveArea').innerHTML = `
                    <button onclick="resetProgress()" class="w-full text-gray-500 font-bold py-4 rounded-xl border-2 border-gray-200 hover:bg-gray-50 transition-colors">
                        התחילי מהתחלה
                    </button>
                `;
                return;
            }

            const lesson = lessons[currentStep];
            
            // הצגת השאלה הניקייה
            document.getElementById('questionText').innerText = lesson.quest;
            
            const area = document.getElementById('interactiveArea');
            
            if (lesson.type === 'text') {
                area.innerHTML = `
                    <div class="flex flex-col gap-4">
                        <input type="text" id="userInput" placeholder="הקלידי כאן (למשל: hola)..." onkeydown="if(event.key==='Enter')checkTextAnswer()" 
                            class="w-full p-4 text-xl border-2 border-gray-300 rounded-xl focus:border-[#1cb0f6] focus:bg-blue-50 outline-none text-center" dir="ltr">
                        <button onclick="checkTextAnswer()" class="w-full duo-blue text-white font-bold px-8 py-4 rounded-xl shadow-[0_4px_0_#1899d6] active:translate-y-1 active:shadow-none text-lg transition-all">
                            בדיקה
                        </button>
                    </div>
                `;
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            } 
            else if (lesson.type === 'choice') {
                area.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${lesson.options.map(opt => `
                            <button onclick="checkChoiceAnswer('${opt.id}')" 
                                class="flex flex-col items-center justify-center p-6 border-2 border-gray-200 rounded-2xl hover:bg-blue-50 hover:border-[#1cb0f6] active:bg-blue-100 transition-all shadow-sm">
                                <span class="text-6xl mb-4">${opt.icon}</span>
                                <span class="font-bold text-gray-700 text-xl">${opt.label}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            }
            updateUI();
        }

        // --- בדיקת תשובות ---
        function checkTextAnswer() {
            const input = document.getElementById('userInput');
            const answer = input.value.toLowerCase().trim();
            
            if (!answer) return;

            if (answer.includes(lessons[currentStep].target)) {
                showSuccess();
            } else {
                alert("אופס! נסי שוב.");
                input.value = '';
                input.focus();
            }
        }

        function checkChoiceAnswer(id) {
            if (id === lessons[currentStep].target) {
                showSuccess();
            } else {
                alert("לא בדיוק... נסי תמונה אחרת!");
            }
        }

        // --- הצגת הפופ-אפ הירוק של ההצלחה ---
        function showSuccess() {
            const footer = document.getElementById('feedbackFooter');
            const tutorMsg = document.getElementById('tutorMessage');
            
            tutorMsg.innerText = lessons[currentStep].tutor;
            
            footer.classList.remove('hidden', 'translate-y-full');
            
            // מוסיף קצת XP מיד
            xp += 15;
            document.getElementById('xpCount').innerText = `${xp} XP ⚡`;
        }

        // --- מעבר לשלב הבא ---
        function advanceLesson() {
            currentStep++;
            saveData();
            updateUI();
            renderLesson();
        }

        // --- עדכון טקסטים ובר למעלה ---
        function updateUI() {
            document.getElementById('xpCount').innerText = `${xp} XP ⚡`;
            
            // עדכון השלב למעלה
            const currentDisplayLevel = currentStep < lessons.length ? currentStep + 1 : lessons.length;
            document.getElementById('levelIndicator').innerText = `שלב ${currentDisplayLevel}/${lessons.length}`;
            
            // עדכון הפס הירוק
            const percent = (currentStep / lessons.length) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        // התחלה
        window.onload = () => {
            renderLesson();
        };
    </script>
</body>
</html>
