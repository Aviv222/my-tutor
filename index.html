<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoStep - ללמוד שפה בצעדים קטנים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .duo-green { background-color: #58cc02; }
        .duo-blue { background-color: #1cb0f6; }
        .chat-bubble { border-radius: 15px; border-width: 2px; border-bottom-width: 4px; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-right" dir="rtl">

    <header class="p-4 border-b-2 border-gray-200 flex justify-between items-center bg-white sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🦉</span>
            <h1 class="font-bold text-xl text-green-500">LingoStep</h1>
        </div>
        <div class="flex flex-col items-end flex-1 px-4">
            <div class="w-full max-w-xs bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="duo-green h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <span id="xpCount" class="text-xs font-bold text-gray-500 mt-1 uppercase">0 XP</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 max-w-2xl mx-auto w-full">
        <div id="instruction" class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 mb-6 text-blue-800 font-bold text-center text-lg shadow-sm transition-all">
            טוען משימה...
        </div>

        <div id="chatWindow" class="flex-1 overflow-y-auto space-y-6 pb-4">
            </div>

        <div id="interactiveArea" class="mt-2 p-4 border-t-2 border-gray-200 bg-white rounded-t-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            </div>
    </main>

    <script>
        let currentStep = 0;
        let xp = 0;
        
        // מערך השיעורים שלנו - משלב גם הקלדה וגם כפתורים עם תמונות!
        const lessons = [
            { 
                type: 'text', 
                quest: 'תגידי "שלום" בספרדית (¡Hola!)', 
                target: 'hola', 
                tutor: '¡Hola! ¿Cómo estás? (שלום! מה שלומך?)', 
                trans: 'שלום! מה שלומך?' 
            },
            { 
                type: 'choice', 
                quest: 'איך אומרים "כלב"?', 
                target: 'perro',
                options: [
                    { id: 'gato', icon: '🐱', label: 'Gato' },
                    { id: 'perro', icon: '🐶', label: 'Perro' },
                    { id: 'pajaro', icon: '🐦', label: 'Pájaro' }
                ],
                tutor: '¡Muy bien! El perro. (יפה מאוד! הכלב.)', 
                trans: 'יפה מאוד! הכלב.' 
            },
            { 
                type: 'text', 
                quest: 'תעני "כן" (Sí)', 
                target: 'si', 
                tutor: '¡Excelente! Terminaste la lección. (מצוין! סיימת את השיעור.)', 
                trans: 'מצוין! סיימת את השיעור.' 
            }
        ];

        // פונקציה שמאתחלת את השיעור הנוכחי
        function renderLesson() {
            if (currentStep >= lessons.length) {
                document.getElementById('instruction').innerText = "כל הכבוד! סיימת את השיעור הראשון! 🎉";
                document.getElementById('interactiveArea').innerHTML = `
                    <button onclick="location.reload()" class="w-full duo-green text-white font-bold px-8 py-4 rounded-xl shadow-[0_4px_0_#46a302] active:translate-y-1 active:shadow-none text-lg">
                        התחילי שיעור מחדש
                    </button>
                `;
                return;
            }

            const lesson = lessons[currentStep];
            document.getElementById('instruction').innerText = `משימה: ${lesson.quest}`;
            
            const area = document.getElementById('interactiveArea');
            
            // אם זה שיעור הקלדה
            if (lesson.type === 'text') {
                area.innerHTML = `
                    <div class="flex gap-2 items-center">
                        <input type="text" id="userInput" placeholder="הקלידי כאן (באנגלית/ספרדית)..." onkeydown="handleEnter(event)"
                            class="flex-1 p-3 border-2 border-gray-200 rounded-xl focus:border-blue-400 outline-none text-left" dir="ltr">
                        <button onclick="checkTextAnswer()" class="duo-blue text-white font-bold px-8 py-3 rounded-xl shadow-[0_4px_0_#1899d6] active:translate-y-1 active:shadow-none transition-all">
                            בדיקה
                        </button>
                    </div>
                `;
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            } 
            // אם זה שיעור בחירה עם תמונות
            else if (lesson.type === 'choice') {
                let buttonsHTML = lesson.options.map(opt => `
                    <button onclick="checkChoiceAnswer('${opt.id}', '${opt.icon} ${opt.label}')" 
                        class="flex flex-col items-center justify-center p-4 border-2 border-gray-200 rounded-xl hover:bg-blue-50 hover:border-blue-400 active:bg-blue-100 transition-all shadow-sm">
                        <span class="text-5xl mb-3">${opt.icon}</span>
                        <span class="font-bold text-gray-700 text-lg">${opt.label}</span>
                    </button>
                `).join('');
                
                area.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        ${buttonsHTML}
                    </div>
                `;
            }
            updateUI();
        }

        // זיהוי לחיצה על מקש אנטר
        function handleEnter(event) {
            if (event.key === 'Enter') {
                checkTextAnswer();
            }
        }

        // בדיקת תשובת טקסט
        function checkTextAnswer() {
            const input = document.getElementById('userInput');
            const text = input.value.toLowerCase().trim();
            if(!text) return;

            if (text.includes(lessons[currentStep].target)) {
                addMessage(input.value, 'user');
                input.value = '';
                advanceLesson();
            } else {
                alert("לא בדיוק... נסי שוב! (טיפ: חפשי את המילה בסוגריים למעלה)");
                input.focus();
            }
        }

        // בדיקת תשובת כפתור
        function checkChoiceAnswer(selectedId, labelText) {
            if (selectedId === lessons[currentStep].target) {
                addMessage(labelText, 'user');
                advanceLesson();
            } else {
                alert("אופס! זו לא התשובה הנכונה. נסי כפתור אחר.");
            }
        }

        // התקדמות לשלב הבא
        function advanceLesson() {
            xp += 15;
            const currentTutorMsg = lessons[currentStep].tutor;
            const currentTransMsg = lessons[currentStep].trans;
            
            currentStep++;
            updateUI();
            
            // תגובת המורה
            setTimeout(() => {
                addTutorMessage(currentTutorMsg, currentTransMsg);
                setTimeout(() => {
                    renderLesson();
                }, 1000);
            }, 600);
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = "chat-bubble duo-blue text-white p-3 max-w-[80%] mr-auto text-left font-bold text-lg shadow-sm";
            div.dir = "ltr";
            div.innerText = text;
            document.getElementById('chatWindow').appendChild(div);
            scroll();
        }

        function addTutorMessage(text, translation) {
            const container = document.createElement('div');
            container.className = "flex flex-col items-start gap-1 mb-4";
            container.innerHTML = `
                <div class="flex items-end gap-2">
                    <span class="text-3xl">🦉</span>
                    <div class="chat-bubble border-gray-200 bg-white p-4 max-w-[100%] text-left shadow-sm" dir="ltr">${text}</div>
                </div>
                <button onclick="toggleTranslation(this, '${translation}')" class="text-sm text-blue-500 font-bold mr-10 hover:underline">הצג תרגום 👁️</button>
            `;
            document.getElementById('chatWindow').appendChild(container);
            scroll();
        }

        function toggleTranslation(btn, text) {
            btn.innerText = (btn.innerText.includes('הצג')) ? `תרגום: ${text}` : 'הצג תרגום 👁️';
        }

        function updateUI() {
            document.getElementById('xpCount').innerText = `${xp} XP`;
            const percent = (currentStep / lessons.length) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function scroll() {
            const win = document.getElementById('chatWindow');
            win.scrollTop = win.scrollHeight;
        }

        // התחלת השיעור כשהעמוד עולה
        window.onload = () => {
            renderLesson();
        };
    </script>
</body>
</html>
